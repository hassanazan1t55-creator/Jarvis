name: Extract website archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-website.yml'
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website files into repository root
        run: |
          test -f my-website.zip
          unzip -o my-website.zip -d .
          rm -f my-website.zip
          rm -f .github/workflows/unpack-website.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add website source files"
          git push
